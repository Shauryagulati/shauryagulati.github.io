name: Deploy tombstone to GitHub Pages
# v1 is retired: the site now serves a redirect to shauryagulati.dev.
# The full v1 source remains in this repo; see README for its story.
on:
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./tombstone
      - id: deployment
        uses: actions/deploy-pages@v4
